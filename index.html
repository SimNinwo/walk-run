<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Splits — Walk/Run Intervals</title>
<meta name="theme-color" content="#0F2027">
<meta name="description" content="A focused walk/run interval trainer that works offline.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F2027;
    --bg-panel: #16323A;
    --bg-panel-2: #1E3D45;
    --hairline: #2A4A52;
    --ink: #EAF2F0;
    --ink-dim: #8FADA9;
    --ink-faint: #5D7C79;
    --run: #E8A33D;
    --run-dim: #4A3D24;
    --walk: #7FA98C;
    --walk-dim: #2E3D34;
    --transit: #6B8CAE;
    --stop: #D96C5C;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .display{ font-family:'Oswald', system-ui, sans-serif; }
  #app{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 28px;
  }
  .screen{ display:none; flex-direction:column; flex:1; animation: fadein .25s ease; }
  .screen.active{ display:flex; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Header ---------- */
  .brand{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; }
  .brand h1{ font-family:'Oswald'; font-weight:600; font-size:28px; letter-spacing:0.5px; margin:0; }
  .brand span.tag{ color:var(--ink-dim); font-size:13px; }
  .icon-btn{
    background:none; border:1px solid var(--hairline); color: var(--ink-dim);
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer;
  }
  .install-btn{ display:none; margin:0 0 16px; width:100%; background:var(--bg-panel-2); border:1px solid var(--hairline); color:var(--ink); padding:11px; border-radius:12px; font:500 14px 'IBM Plex Sans',system-ui,sans-serif; cursor:pointer; }
  .install-btn.visible{ display:block; }

  /* ---------- Setup: presets ---------- */
  .section-label{ color:var(--ink-dim); font-size:12.5px; margin: 22px 0 10px; }
  .presets{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .preset-chip{
    flex:0 0 auto; background: var(--bg-panel); border:1px solid var(--hairline);
    color:var(--ink); padding:10px 16px; border-radius:999px; font-size:14px; cursor:pointer;
    white-space:nowrap;
  }
  .preset-chip.active{ background: var(--run-dim); border-color: var(--run); color: var(--run); }

  .config-card{
    background: var(--bg-panel); border-radius: var(--radius); padding: 6px 4px; margin-top: 10px;
  }
  .config-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 14px; border-bottom: 1px solid var(--hairline);
  }
  .config-row:last-child{ border-bottom:none; }
  .config-row .label{ font-size:15px; }
  .config-row .label small{ display:block; color:var(--ink-faint); font-size:12px; margin-top:2px; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--hairline);
    background: var(--bg-panel-2); color:var(--ink); font-size:16px; cursor:pointer; line-height:1;
  }
  .stepper .val{ font-family:'Oswald'; font-size:17px; min-width:64px; text-align:center; }

  .start-btn{
    margin-top: 26px; background: var(--run); color: #22160A; border:none;
    font-family:'Oswald'; font-weight:600; font-size:18px; letter-spacing:0.5px;
    padding:17px; border-radius: var(--radius); cursor:pointer;
  }
  .ghost-btn{
    margin-top:12px; background:none; border:none; color: var(--ink-dim);
    font-size:14px; padding:10px; cursor:pointer; text-decoration:underline; text-decoration-color: var(--hairline);
  }
  .total-line{ text-align:center; color:var(--ink-faint); font-size:13px; margin-top:14px; }

  /* ---------- Session ---------- */
  .session-top{ display:flex; justify-content:space-between; color:var(--ink-dim); font-size:13px; margin-bottom:10px; }
  .session-top b{ color:var(--ink); font-family:'Oswald'; font-weight:500; }

  .ring-wrap{ position:relative; width:100%; max-width:300px; margin: 10px auto 8px; aspect-ratio:1/1; }
  .ring-wrap svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .ring-bg{ fill:none; stroke: var(--bg-panel); stroke-width:14; }
  .ring-fg{ fill:none; stroke-width:14; stroke-linecap:round; transition: stroke .3s ease; }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .phase-label{ font-family:'Oswald'; font-size:16px; letter-spacing:2px; font-weight:600; margin-bottom:2px; }
  .phase-time{ font-family:'Oswald'; font-size:56px; font-weight:600; line-height:1; }
  .phase-next{ color:var(--ink-faint); font-size:12.5px; margin-top:6px; }

  .lane{ display:flex; gap:4px; margin: 18px 0 4px; flex-wrap:wrap; justify-content:center; }
  .lane .dash{ width:16px; height:5px; border-radius:3px; background: var(--bg-panel); }
  .lane .dash.done{ background: var(--ink-dim); }
  .lane .dash.now{ background: var(--run); }

  .controls{ display:flex; gap:10px; margin-top:auto; padding-top:20px; }
  .controls button{
    flex:1; padding:16px; border-radius: var(--radius); border:1px solid var(--hairline);
    background: var(--bg-panel); color: var(--ink); font-family:'Oswald'; font-size:15px; font-weight:500; cursor:pointer;
  }
  .controls button.primary{ background: var(--run); border-color:var(--run); color:#22160A; }
  .controls button.stop{ color: var(--stop); }

  /* ---------- Summary ---------- */
  .summary-hero{ text-align:center; padding: 30px 0 10px; }
  .summary-hero .big{ font-family:'Oswald'; font-size:44px; font-weight:600; }
  .summary-hero .sub{ color:var(--ink-dim); font-size:14px; margin-top:6px; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:24px; }
  .stat-card{ background:var(--bg-panel); border-radius:14px; padding:16px; }
  .stat-card .n{ font-family:'Oswald'; font-size:24px; font-weight:600; }
  .stat-card .l{ color:var(--ink-dim); font-size:12.5px; margin-top:4px; }

  /* ---------- History ---------- */
  .hist-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; border-bottom:1px solid var(--hairline);
  }
  .hist-row .d{ font-size:14.5px; }
  .hist-row .d small{ display:block; color:var(--ink-faint); font-size:12px; margin-top:2px; }
  .hist-row .t{ font-family:'Oswald'; font-size:16px; color:var(--ink-dim); }
  .empty{ color:var(--ink-faint); text-align:center; padding:60px 20px; font-size:14px; }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 4px; }
  .switch{ width:44px; height:26px; border-radius:20px; background:var(--bg-panel-2); position:relative; cursor:pointer; border:1px solid var(--hairline); }
  .switch .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--ink-dim); transition: all .2s ease; }
  .switch.on{ background: var(--walk-dim); border-color:var(--walk); }
  .switch.on .knob{ left:22px; background:var(--walk); }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <div class="screen active" id="screen-setup">
    <div class="brand">
      <div><h1>Splits</h1><span class="tag">Walk/run interval training</span></div>
      <button class="icon-btn" onclick="goTo('history')" title="History">&#9776;</button>
    </div>

    <div class="section-label">Presets</div>
    <div class="presets" id="presetRow"></div>

    <div class="section-label">Session</div>
    <div class="config-card" id="configCard"></div>

    <button class="install-btn" id="installBtn" type="button">Install Splits for offline training</button>
    <div class="total-line" id="totalLine"></div>
    <button class="start-btn" onclick="startSession()">Start session</button>
    <button class="ghost-btn" onclick="goTo('history')">View history</button>
  </div>

  <!-- SESSION SCREEN -->
  <div class="screen" id="screen-session">
    <div class="session-top">
      <span>Round <b id="roundNow">1</b>/<b id="roundTotal">6</b></span>
      <span>Elapsed <b id="elapsedTime">0:00</b></span>
      <span>Left <b id="remainingTime">0:00</b></span>
    </div>

    <div class="ring-wrap">
      <svg viewBox="0 0 240 240">
        <circle class="ring-bg" cx="120" cy="120" r="100"></circle>
        <circle class="ring-fg" id="ringFg" cx="120" cy="120" r="100"
          stroke-dasharray="628.318" stroke-dashoffset="0" stroke="#E8A33D"></circle>
      </svg>
      <div class="ring-center">
        <div class="phase-label" id="phaseLabel">WARM UP</div>
        <div class="phase-time display" id="phaseTime">5:00</div>
        <div class="phase-next" id="phaseNext">Next: Run 1:00</div>
      </div>
    </div>

    <div class="lane" id="laneRow"></div>

    <div class="controls">
      <button id="pauseBtn" onclick="togglePause()">Pause</button>
      <button onclick="skipPhase()">Skip</button>
      <button class="stop" onclick="endSession(false)">End</button>
    </div>
  </div>

  <!-- SUMMARY SCREEN -->
  <div class="screen" id="screen-summary">
    <div class="brand"><h1>Nice work</h1></div>
    <div class="summary-hero">
      <div class="big display" id="sumTotal">0:00</div>
      <div class="sub">total session time</div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="n display" id="sumRounds">0</div><div class="l">Rounds completed</div></div>
      <div class="stat-card"><div class="n display" id="sumRun">0:00</div><div class="l">Time running</div></div>
      <div class="stat-card"><div class="n display" id="sumWalk">0:00</div><div class="l">Time walking</div></div>
      <div class="stat-card"><div class="n display" id="sumPreset">—</div><div class="l">Preset used</div></div>
    </div>
    <button class="start-btn" onclick="goTo('setup')">New session</button>
    <button class="ghost-btn" onclick="goTo('history')">View history</button>
  </div>

  <!-- HISTORY SCREEN -->
  <div class="screen" id="screen-history">
    <div class="brand">
      <h1>History</h1>
      <button class="icon-btn" onclick="goTo('setup')" title="Back">&#8592;</button>
    </div>
    <div class="toggle-row">
      <span>Sound cues</span>
      <div class="switch" id="soundSwitch" onclick="toggleSound()"><div class="knob"></div></div>
    </div>
    <div id="historyList"></div>
    <button class="ghost-btn" id="clearHistBtn" onclick="clearHistory()">Clear history</button>
  </div>

</div>

<script>
/* ---------------- Presets & config ---------------- */
const PRESETS = [
  { key:'beginner', name:'Beginner', warmup:300, run:60,  walk:120, rounds:6,  cooldown:300 },
  { key:'steady',   name:'Steady',   warmup:300, run:180, walk:120, rounds:6,  cooldown:300 },
  { key:'sprint',   name:'Sprint',   warmup:480, run:30,  walk:90,  rounds:10, cooldown:300 },
  { key:'custom',   name:'Custom',   warmup:300, run:90,  walk:90,  rounds:8,  cooldown:180 },
];
let config = { ...PRESETS[0] };
let soundOn = true;
let history = [];
let deferredInstallPrompt = null;

// The original prototype used a host-provided storage API. This adapter keeps
// the app working as a standalone PWA while remaining compatible with that host.
const storage = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function') return window.storage.get(key, false);
    return { value: localStorage.getItem(key) };
  },
  async set(key, value){
    if(window.storage && typeof window.storage.set === 'function') return window.storage.set(key, value, false);
    localStorage.setItem(key, value);
  }
};

const FIELD_DEFS = [
  { key:'warmup',   label:'Warm up',   unit:'sec', min:0,  max:900, step:30 },
  { key:'run',      label:'Run',       unit:'sec', min:10, max:600, step:10 },
  { key:'walk',     label:'Walk',      unit:'sec', min:10, max:600, step:10 },
  { key:'rounds',   label:'Rounds',    unit:'ct',  min:1,  max:20,  step:1  },
  { key:'cooldown', label:'Cool down', unit:'sec', min:0,  max:900, step:30 },
];

function fmtClock(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function fmtField(sec, unit){
  if(unit==='ct') return String(sec);
  if(sec < 60) return sec + 's';
  return fmtClock(sec);
}

function renderPresets(){
  const row = document.getElementById('presetRow');
  row.innerHTML = '';
  PRESETS.forEach(p=>{
    const chip = document.createElement('div');
    chip.className = 'preset-chip' + (config.key===p.key ? ' active':'');
    chip.textContent = p.name;
    chip.onclick = ()=>{ config = { ...p }; saveSettings(); renderAll(); };
    row.appendChild(chip);
  });
}

function renderConfig(){
  const card = document.getElementById('configCard');
  card.innerHTML = '';
  FIELD_DEFS.forEach(f=>{
    const row = document.createElement('div');
    row.className = 'config-row';
    row.innerHTML = `
      <div class="label">${f.label}</div>
      <div class="stepper">
        <button aria-label="decrease">&minus;</button>
        <div class="val display">${fmtField(config[f.key], f.unit)}</div>
        <button aria-label="increase">&plus;</button>
      </div>`;
    const [minus, , plus] = row.querySelectorAll('button, div.val, button');
    const buttons = row.querySelectorAll('button');
    buttons[0].onclick = ()=> adjustField(f, -f.step);
    buttons[1].onclick = ()=> adjustField(f, f.step);
    card.appendChild(row);
  });
}
function adjustField(f, delta){
  config.key = 'custom';
  config[f.key] = Math.min(f.max, Math.max(f.min, config[f.key] + delta));
  saveSettings();
  renderAll();
}

function renderTotal(){
  const total = config.warmup + config.cooldown + config.rounds*(config.run+config.walk);
  document.getElementById('totalLine').textContent = 'Total time ' + fmtClock(total) + ' · ' + config.rounds + ' rounds';
}

function renderAll(){ renderPresets(); renderConfig(); renderTotal(); }

/* ---------------- Screens ---------------- */
function goTo(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='history') renderHistory();
  if(name==='setup') renderAll();
}

/* ---------------- Session engine ---------------- */
let phases = [];       // [{type:'warmup'|'run'|'walk'|'cooldown', dur:sec, round:n}]
let phaseIdx = 0;
let phaseStartedAt = 0;
let phaseElapsedBeforePause = 0;
let paused = false;
let tickHandle = null;
let sessionStats = { run:0, walk:0, start:0 };
let wakeLock = null;

function buildPhases(){
  const list = [];
  if(config.warmup>0) list.push({type:'warmup', dur:config.warmup});
  for(let r=1;r<=config.rounds;r++){
    list.push({type:'run', dur:config.run, round:r});
    list.push({type:'walk', dur:config.walk, round:r});
  }
  if(config.cooldown>0) list.push({type:'cooldown', dur:config.cooldown});
  return list;
}

const PHASE_META = {
  warmup:   { label:'WARM UP',  color:'var(--transit)' },
  run:      { label:'RUN',      color:'var(--run)' },
  walk:     { label:'WALK',     color:'var(--walk)' },
  cooldown: { label:'COOL DOWN',color:'var(--transit)' },
};
function phaseColorHex(type){
  return { warmup:'#6B8CAE', run:'#E8A33D', walk:'#7FA98C', cooldown:'#6B8CAE' }[type];
}

function startSession(){
  phases = buildPhases();
  phaseIdx = 0;
  sessionStats = { run:0, walk:0, start:Date.now() };
  paused = false;
  requestWakeLock();
  renderLane();
  document.getElementById('roundTotal').textContent = config.rounds;
  goTo('session');
  beginPhase(true);
  tickHandle = setInterval(tick, 200);
}

function beginPhase(announce){
  const ph = phases[phaseIdx];
  phaseStartedAt = Date.now();
  phaseElapsedBeforePause = 0;
  document.getElementById('roundNow').textContent = ph.round || (phases.find(p=>p.round) ? '—' : 1);
  updatePhaseUI(ph, ph.dur);
  updateLane();
  if(announce) playCue(ph.type==='run' ? 'run' : ph.type==='walk' ? 'walk' : 'transit');
}

function currentElapsedInPhase(){
  if(paused) return phaseElapsedBeforePause;
  return phaseElapsedBeforePause + (Date.now()-phaseStartedAt)/1000;
}

function tick(){
  const ph = phases[phaseIdx];
  if(!ph) return;
  const elapsed = currentElapsedInPhase();
  const remaining = ph.dur - elapsed;

  if(ph.type==='run') sessionStats.run = sessionStats.run; // accumulated on transition, see below
  updatePhaseUI(ph, Math.max(0, remaining));

  // countdown ticks in final 3 seconds
  if(!paused && remaining <= 3.15 && remaining > 2.85) playCue('tick');
  if(!paused && remaining <= 2.15 && remaining > 1.85) playCue('tick');
  if(!paused && remaining <= 1.15 && remaining > 0.85) playCue('tick');

  if(remaining <= 0 && !paused){
    // bank elapsed time for stats
    if(ph.type==='run') sessionStats.run += ph.dur;
    if(ph.type==='walk') sessionStats.walk += ph.dur;
    advancePhase();
  }

  document.getElementById('elapsedTime').textContent = fmtClock((Date.now()-sessionStats.start)/1000);
}

function advancePhase(){
  phaseIdx++;
  if(phaseIdx >= phases.length){
    finishSession();
    return;
  }
  beginPhase(true);
}

function skipPhase(){
  const ph = phases[phaseIdx];
  const elapsed = currentElapsedInPhase();
  if(ph.type==='run') sessionStats.run += elapsed;
  if(ph.type==='walk') sessionStats.walk += elapsed;
  advancePhase();
}

function togglePause(){
  paused = !paused;
  if(paused){
    phaseElapsedBeforePause = currentElapsedInPhase();
  } else {
    phaseStartedAt = Date.now();
  }
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
}

function updatePhaseUI(ph, remainingSec){
  const meta = PHASE_META[ph.type];
  document.getElementById('phaseLabel').textContent = meta.label;
  document.getElementById('phaseLabel').style.color = meta.color;
  document.getElementById('phaseTime').textContent = fmtClock(remainingSec);

  const next = phases[phaseIdx+1];
  document.getElementById('phaseNext').textContent = next
    ? 'Next: ' + PHASE_META[next.type].label.replace('_',' ') + ' ' + fmtClock(next.dur)
    : 'Final phase';

  const circumference = 628.318;
  const frac = Math.max(0, Math.min(1, remainingSec / ph.dur));
  const ring = document.getElementById('ringFg');
  ring.style.stroke = phaseColorHex(ph.type);
  ring.setAttribute('stroke-dashoffset', String(circumference * (1-frac)));

  const totalRemaining = remainingSec + phases.slice(phaseIdx+1).reduce((a,p)=>a+p.dur,0);
  document.getElementById('remainingTime').textContent = fmtClock(totalRemaining);
}

function renderLane(){
  const row = document.getElementById('laneRow');
  row.innerHTML = '';
  for(let r=1;r<=config.rounds;r++){
    const d = document.createElement('div');
    d.className = 'dash';
    d.dataset.round = r;
    row.appendChild(d);
  }
}
function updateLane(){
  const ph = phases[phaseIdx];
  const round = ph.round;
  document.querySelectorAll('.lane .dash').forEach(d=>{
    const r = Number(d.dataset.round);
    d.classList.remove('done','now');
    if(round && r < round) d.classList.add('done');
    if(round && r === round) d.classList.add('now');
  });
}

function finishSession(){
  clearInterval(tickHandle);
  releaseWakeLock();
  playCue('done');
  const totalSec = (Date.now()-sessionStats.start)/1000;
  document.getElementById('sumTotal').textContent = fmtClock(totalSec);
  document.getElementById('sumRounds').textContent = config.rounds;
  document.getElementById('sumRun').textContent = fmtClock(sessionStats.run);
  document.getElementById('sumWalk').textContent = fmtClock(sessionStats.walk);
  document.getElementById('sumPreset').textContent = config.name;
  goTo('summary');
  saveSessionToHistory(totalSec, true);
}

function endSession(completed){
  clearInterval(tickHandle);
  releaseWakeLock();
  const totalSec = (Date.now()-sessionStats.start)/1000;
  saveSessionToHistory(totalSec, false);
  goTo('setup');
}

/* ---------------- Audio & haptics ---------------- */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function beep(freq, dur, delay, gainVal){
  const ctx = ensureAudio();
  if(!ctx || !soundOn) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(gainVal||0.16, t0+0.02);
  gain.gain.linearRampToValueAtTime(0, t0+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function playCue(kind){
  if(kind==='run'){ beep(660,0.14,0); beep(880,0.16,0.16); }
  else if(kind==='walk'){ beep(520,0.2,0); }
  else if(kind==='transit'){ beep(440,0.18,0); }
  else if(kind==='tick'){ beep(300,0.08,0,0.08); }
  else if(kind==='done'){ beep(523,0.15,0); beep(659,0.15,0.15); beep(784,0.25,0.3); }
  if(navigator.vibrate){
    try{
      if(kind==='run') navigator.vibrate([80,60,80]);
      else if(kind==='walk') navigator.vibrate(120);
      else if(kind==='done') navigator.vibrate([100,80,100,80,200]);
    }catch(e){}
  }
}
async function requestWakeLock(){
  try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){ wakeLock = null; }
}
function releaseWakeLock(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; }

/* ---------------- Sound toggle ---------------- */
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('soundSwitch').classList.toggle('on', soundOn);
  saveSettings();
}

/* ---------------- Storage ---------------- */
async function loadSettings(){
  try{
    const r = await storage.get('splits:settings');
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      if(parsed.config) config = parsed.config;
      if(typeof parsed.soundOn === 'boolean') soundOn = parsed.soundOn;
    }
  }catch(e){ /* no settings yet */ }
  document.getElementById('soundSwitch').classList.toggle('on', soundOn);
}
async function saveSettings(){
  try{
    await storage.set('splits:settings', JSON.stringify({ config, soundOn }));
  }catch(e){ console.error('settings save failed', e); }
}
async function loadHistory(){
  try{
    const r = await storage.get('splits:history');
    if(r && r.value) history = JSON.parse(r.value);
  }catch(e){ history = []; }
}
async function saveSessionToHistory(totalSec, completed){
  const entry = {
    date: new Date().toISOString(),
    preset: config.name,
    rounds: config.rounds,
    totalSec: Math.round(totalSec),
    runSec: Math.round(sessionStats.run),
    walkSec: Math.round(sessionStats.walk),
    completed
  };
  history.unshift(entry);
  if(history.length > 50) history = history.slice(0,50);
  try{ await storage.set('splits:history', JSON.stringify(history)); }
  catch(e){ console.error('history save failed', e); }
}
function renderHistory(){
  const list = document.getElementById('historyList');
  const clearBtn = document.getElementById('clearHistBtn');
  if(!history.length){
    list.innerHTML = '<div class="empty">No sessions yet — finish a workout to see it here.</div>';
    clearBtn.style.display = 'none';
    return;
  }
  clearBtn.style.display = 'block';
  list.innerHTML = '';
  history.forEach(h=>{
    const d = new Date(h.date);
    const dateStr = d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.innerHTML = `
      <div class="d">${h.preset}${h.completed?'':' (ended early)'}<small>${dateStr} · ${h.rounds} rounds</small></div>
      <div class="t display">${fmtClock(h.totalSec)}</div>`;
    list.appendChild(row);
  });
}
async function clearHistory(){
  history = [];
  try{ await storage.set('splits:history', JSON.stringify(history)); }catch(e){}
  renderHistory();
}

/* ---------------- Init ---------------- */
(async function init(){
  await loadSettings();
  await loadHistory();
  renderAll();
})();

/* ---------------- PWA install & offline ---------------- */
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredInstallPrompt = event;
  installBtn.classList.add('visible');
});
installBtn.addEventListener('click', async () => {
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.classList.remove('visible');
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  installBtn.classList.remove('visible');
});
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
</script>
